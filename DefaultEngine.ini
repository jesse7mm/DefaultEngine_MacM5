; ==============================================================================
; DefaultEngine.ini
; Optimized for Apple Silicon Mac (M5 10-Core / 24 GB Unified Memory)
; Configured for OpenWorld / World Partition with Substrate Materials
; ==============================================================================

[/Script/EngineSettings.GameMapsSettings]
; replace your map name here
GameDefaultMap=/Engine/Maps/Templates/OpenWorld

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True

; ------------------------------------------------------------------------------
; Ray Tracing & Metal Optimization
; Note: Hardware ray tracing on Metal introduces severe frame pacing penalties.
; Kept enabled per project defaults, but software fallback is prioritized.
; ------------------------------------------------------------------------------
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True

; ------------------------------------------------------------------------------
; Substrate Materials Tuning
; Format 0 provides optimal balance between fidelity and GPU memory footprint.
; ------------------------------------------------------------------------------
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0
r.Substrate.BytesPerPixel=64

; Exposure & Tonemapping
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

; Anti-Aliasing (Temporal Super Resolution for Apple Retina displays)
r.AntiAliasingMethod=4
r.DefaultFeature.AntiAliasing=4

; Nanite Geometry Settings
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=1.5
r.Nanite.Streaming.NumInitialPages=4096

; Virtual Shadow Map Caching (Reduces per-frame overhead on Metal)
r.Shadow.Virtual.Cache=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5

; ------------------------------------------------------------------------------
; Unified Memory Management (Configured for 24 GB Unified Architecture)
; ------------------------------------------------------------------------------
[/Script/Engine.StreamingSettings]
s.AsyncLoadingThreadEnabled=True
s.PriorityAsyncLoadingExtraTime=15.0
s.LevelStreamingActorsUpdateTimeLimit=5.0
s.PrioritySolve=1
r.Streaming.PoolSize=4096
r.Streaming.UseBackgroundThreadPool=1
r.Streaming.LimitPoolSizeToVRAM=0
r.Streaming.DefragDynamicBounds=1

[/Script/Engine.GarbageCollectionSettings]
gc.TimeBetweenPurgingPendingKillObjects=45.0
gc.FlushStreamingOnGC=0
gc.NumRetriesBeforeForcingGC=10
gc.IncrementalBeginDestroyEnabled=True
gc.MultithreadedClearGatheredReferences=True

; ------------------------------------------------------------------------------
; Target Platform Configurations (Preserved & Metal-Tuned)
; ------------------------------------------------------------------------------
[/Script/MacTargetPlatform.MacTargetSettings]
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6
bEnableRayTracing=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5
Compiler=Default
AudioSampleRate=48000
AudioCallbackBufferFrameSize=1024
AudioNumBuffersToEnqueue=1
AudioMaxChannels=0
AudioNumSourceWorkers=4
SpatializationPlugin=
SourceDataOverridePlugin=
ReverbPlugin=
OcclusionPlugin=
CompressionOverrides=(bOverrideCompressionTimes=False,DurationThreshold=5.000000,MaxNumRandomBranches=0,SoundCueQualityIndex=0)
CacheSizeKB=65536
MaxChunkSizeOverrideKB=0
bResampleForDevice=False
MaxSampleRate=48000.000000
HighSampleRate=32000.000000
MedSampleRate=24000.000000
LowSampleRate=12000.000000
MinSampleRate=8000.000000
CompressionQualityModifier=1.000000
AutoStreamingThreshold=0.000000
SoundCueCookQualityIndex=-1

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WorldPartitionEditor.WorldPartitionEditorSettings]
CommandletClass=Class'/Script/UnrealEd.WorldPartitionConvertCommandlet'

[/Script/Engine.UserInterfaceSettings]
bAuthorizeAutomaticWidgetVariableCreation=False
FontDPIPreset=Standard
FontDPI=72

; ------------------------------------------------------------------------------
; Engine & Game Redirections (Preserved)
; ------------------------------------------------------------------------------
[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_BlankBP",NewGameName="/Script/KAL")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_BlankBP",NewGameName="/Script/KAL")

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=6DC48DFFB4444444519B50B14C7A79CF
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=

; ------------------------------------------------------------------------------
; System Runtime Console Variables (Apple Silicon M5 10-Core / Metal Tuning)
; ------------------------------------------------------------------------------
[SystemSettings]
; Multi-threading for 10-core CPU
TaskGraph.UsePrioritizedTasks=1
a.ParallelAnimUpdate=1
a.ParallelAnimInterpolation=1
fx.Niagara.AllowAsyncWork=1
fx.Niagara.QualityLevel=2

; Display & TSR Upscaling
r.ScreenPercentage=75
r.TSR.History.ScreenPercentage=100

; Lumen & Substrate balance for Metal
r.Lumen.HardwareRayTracing=0
r.LumenScene.SurfaceCache.CardResolution=128
r.Lumen.Reflections.TemporalFilter=1
r.VolumetricFog.GridPixelSizeK=16
r.VolumetricRenderTarget=1

; PSO Caching to eliminate shader hitching on macOS
r.Metal.Breadcrumbs=0
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.ReportPSO=1
r.ShaderPipelineCache.BatchSize=50
r.ShaderPipelineCache.BackgroundBatchSize=1
